# Model definitions for Jot.
# Copy this file to config.yaml and customize.
# API keys are read from .env — keyed by provider:
#   anthropic → ANTHROPIC_API_KEY
#   openai    → OPENAI_API_KEY
#   gemini    → GEMINI_API_KEY
#   ollama    → (none)

models:
  anthropic-sonnet:
    provider: anthropic
    model: claude-sonnet-4-20250514
    temperature: 0.7

  openai-gpt4o:
    provider: openai
    model: gpt-4o
    temperature: 0.7

  gemini-flash:
    provider: gemini
    model: gemini-2.5-flash
    temperature: 0.7

  ollama-local:
    provider: ollama
    model: llama3.1
    base_url: http://localhost:11434/v1
    temperature: 0.7

active_model: anthropic-sonnet

# App settings (Discord tokens, DATABASE_PATH, WEB_ADDR/WEB_PORT, etc.) live in
# .env, not here. The embedded web UI starts when WEB_ADDR or WEB_PORT is set:
# WEB_ADDR is the bind host (defaults to 127.0.0.1 / loopback), WEB_PORT is the
# port (defaults to 8080). For Tailscale, set WEB_ADDR to the node's tailnet IP.
# There is no app-level auth; use network ACLs.
